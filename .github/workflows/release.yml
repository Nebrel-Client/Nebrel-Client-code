name: Release

# Publishing a launcher version is one gesture: push a tag.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the source of truth for the version. The job refuses to build if it
# disagrees with tauri.conf.json, because the updater compares the release tag
# against the version baked into the client: a mismatch means every client would
# either never update or update in a loop.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  # A tag push builds on an isolated ref: GitHub only lets a cache be restored
  # on the ref it was saved on, or on the default branch. Since this workflow
  # otherwise only ever ran on tags, no cache from any previous release build
  # was ever reachable, and every single release rebuilt all ~825 dependencies
  # from nothing — the 20-28 minute builds. This job runs on every push to
  # main (a plain `cargo build`, no bundling or signing) purely to keep a
  # cache warm under the default branch, which the release job below can then
  # restore. `shared-key` pins both jobs to the same cache slot regardless of
  # their different job names, which rust-cache otherwise keys separately by.
  warm-cache:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: release-windows
      - name: Pre-build the dependencies
        working-directory: src-tauri
        run: cargo build --release

  windows:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Read the version and check it against the tag
        id: version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          configured=$(node -p "require('./src-tauri/tauri.conf.json').version")

          if [ "$version" != "$configured" ]; then
            echo "::error::Tag $tag says $version but src-tauri/tauri.conf.json says $configured."
            echo "::error::Update the config to match, or tag the version that is configured."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: release-windows

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      # Catches an empty or unreachable secret here, where the message is clear,
      # rather than 20 minutes later at the signing step.
      - name: Check the signing secrets are readable
        env:
          KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_PRIVATE_KEY is empty. Add it under Settings, Secrets and variables, Actions, Repository secrets."
            exit 1
          fi
          if [ -z "$PASSWORD" ]; then
            echo "::error::TAURI_KEY_PASSWORD is empty. Add it under Settings, Secrets and variables, Actions, Repository secrets."
            exit 1
          fi
          echo "Both secrets are present (${#KEY} characters of key)."

      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: yarn tauri build

      # The updater looks for one fixed name, so the version has to come out of
      # the filename that Tauri generates.
      - name: Rename the installer to the fixed release name
        id: rename
        shell: bash
        run: |
          nsis="src-tauri/target/release/bundle/nsis"
          installer="$nsis/Nebrel Launcher_${{ steps.version.outputs.version }}_x64-setup.exe"

          if [ ! -f "$installer" ]; then
            echo "::error::No installer at $installer"
            ls -la "$nsis" || true
            exit 1
          fi

          # Without the signature the update route treats the release as absent,
          # so a missing .sig must fail here rather than ship silently.
          if [ ! -f "$installer.sig" ]; then
            echo "::error::The installer is unsigned. Check TAURI_PRIVATE_KEY and TAURI_KEY_PASSWORD."
            exit 1
          fi

          mkdir -p dist-release
          cp "$installer" dist-release/nebrelclient-release.exe
          cp "$installer.sig" dist-release/nebrelclient-release.exe.sig
          # Compatibility alias requested for manual downloads. The updater
          # continues using the matching canonical .exe.sig asset above.
          cp "$installer.sig" dist-release/nebrel-release.exe.sig
          ls -la dist-release

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Nebrel Launcher ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist-release/nebrelclient-release.exe
            dist-release/nebrelclient-release.exe.sig
            dist-release/nebrel-release.exe.sig
